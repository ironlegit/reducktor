<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self';
               font-src 'self';
               img-src 'self' data:;
               connect-src 'none';
               form-action 'none';
               base-uri 'none'"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re███tor</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/ui.css" />
  </head>
  <body>
    <!-- Mobile Block -->
    <div class="mobile-block">
      🦆🦆🦆🦆🦆🦆<br />⚠️ This page isn't supported on mobile yet. Please visit
      on a desktop browser.
    </div>
    <div class="svg-container">
      <img src="assets/reducktor.svg" alt="Re🦆tor" />
    </div>
    <h4>A Text Redaction Tool</h4>
    <!-- SIDE PANEL TOGGLE -->
    <div class="toggle-container left">
      <button id="sidebar-btn" class="toggle-btn">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <!-- DARK MODE TOGGLE BUTTON CONTAINER -->
    <div class="toggle-container right">
      <button id="darkmode-btn" class="toggle-btn">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="clipboard-wrapper">
      <div class="tab-switcher">
        <button
          class="tabBtn active"
          id="tabIn"
          data-tooltip="View the original text"
        >
          Original
        </button>
        <button
          class="tabBtn"
          id="tabOut"
          data-tooltip="View the redacted version"
        >
          Redacted
        </button>
        <button class="tabBtn" id="flushBtn" data-tooltip="Flush Output">
          <i class="fas fa-trash-can"></i>
        </button>
      </div>

      <div class="clipboard-panel">
        <div
          id="clipboardIn"
          contenteditable="true"
          placeholder="Dump your text here..."
        ></div>
        <div id="clipboardOut" contenteditable="false"></div>
        <button class="tabBtn" id="copyBtn">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <!-- BUTTON CONTAINER PRESET -->
    <div class="button-container-exp">
      <span class="experimental-label">THEMATIC NLP REDACTORS </span>
      <button class="redact-btn" id="redact-orgs-btn">Orgs</button>
      <button class="redact-btn" id="redact-names-btn">Names</button>
      <button class="redact-btn" id="redact-dates-btn">Dates</button>
      <button class="redact-btn" id="redact-phones-btn">Phones</button>
      <button class="redact-btn" id="redact-emails-btn">Emails</button>
      <button class="redact-btn" id="redact-places-btn">Places</button>
    </div>

    <!-- REDACTION PATTERNS TEXT AREA -->
    <div
      id="redactPatterns"
      contenteditable="true"
      placeholder="One pattern per line. Use /%/ to replace a pattern with a custom word."
    ></div>

    <!-- BUTTON CONTAINER CUSTOM -->
    <div class="button-container">
      <button class="redact-btn" id="redactBtn">Redact Custom Text</button>
      <button
        class="redact-btn"
        id="reverseBtn"
        aria-pressed="false"
        data-tooltip="Reverses the order of the redaction pattern."
      >
        Reverse: off
      </button>
    </div>

    <!-- Backdrop -->
    <div class="panel-backdrop" id="panelBackdrop"></div>

    <!-- SIDE PANEL -->
    <aside class="side-panel">
      <button class="close-btn" id="panelCloseBtn">×</button>
      <div class="panel-content">
        <h2 class="panel-title">Demo mode</h2>
        <div class="button-container">
          <button class="redact-btn" id="demoBtn">Load Example</button>
        </div>
        <h2 class="panel-title">Redaction Parameters</h2>

        <div class="panel-section">
          <p class="section-label">Redaction Placeholder</p>
          <div class="pill-group" id="placeholderMode">
            <input
              type="radio"
              name="placeholderMode"
              id="block"
              value="false"
              checked
            />
            <label
              for="block"
              class="pill"
              data-tooltip="Use block-style placeholders: █████"
              >Block</label
            >

            <input
              type="radio"
              name="placeholderMode"
              id="labelled"
              value="true"
            />
            <label
              for="labelled"
              class="pill"
              data-tooltip="Use labelled placeholders: [REDACTED-DATE]"
              >Labelled</label
            >
          </div>
        </div>
      </div>
    </aside>

    <div class="footer">
      <span class="footer-light">Powered by Robo [【•】◡【•】]</span>
      <span class="footer-dark">Powered by Robo [【-】◡【-】] zZz</span>
      <a
        href="https://github.com/ironlegit/shiny-clippy"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-github"
        aria-label="View source on GitHub"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
        .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
        -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </div>
    <!-- Import NLP module and JS -->
    <script src="vendor/compromise.js"></script>
    <script src="vendor/compromise-dates.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/button.js"></script>
  </body>
</html>
