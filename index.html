<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re███tor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/ui.css" />
  </head>
  <body>
    <!-- Mobile Block -->
    <div class="mobile-block">
      🦆🦆🦆🦆🦆🦆<br />⚠️ This page isn't supported on mobile yet. Please visit
      on a desktop browser.
    </div>
    <div class="svg-container">
      <img src="assets/reducktor.svg" alt="Re🦆tor" />
    </div>
    <h4>A Text Redaction Tool</h4>
    <!-- SIDE PANEL TOGGLE -->
    <div class="toggle-container left">
      <button id="sidebar-btn" class="toggle-btn" onclick="togglePanel()">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <!-- DARK MODE TOGGLE BUTTON CONTAINER -->
    <div class="toggle-container right">
      <button id="darkmode-btn" class="toggle-btn" onclick="toggleDarkMode()">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="clipboard-wrapper">
      <div class="tab-switcher">
        <button
          class="tabBtn active"
          id="tabIn"
          onclick="switchToIn()"
          data-tooltip="View the original text"
        >
          Original
        </button>
        <button
          class="tabBtn"
          id="tabOut"
          onclick="switchToOut()"
          data-tooltip="View the redacted version"
        >
          Redacted
        </button>
        <button
          class="tabBtn"
          id="flushBtn"
          onclick="flushButtonAction()"
          data-tooltip="Flush Output"
        >
          <i class="fas fa-trash-can"></i>
        </button>
      </div>

      <div class="clipboard-panel">
        <div
          id="clipboardIn"
          contenteditable="true"
          placeholder="Dump your text here..."
        ></div>
        <div id="clipboardOut" contenteditable="false"></div>
        <button class="tabBtn" id="copyBtn" onclick="copyClipboardContent()">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <!-- BUTTON CONTAINER PRESET -->
    <div class="button-container-exp">
      <span class="experimental-label">THEMATIC REDACTORS</span>
      <button
        class="redact-btn"
        onclick="redactOrgs()"
        data-tooltip="Redact common organizations"
      >
        Orgs
      </button>
      <button
        class="redact-btn"
        onclick="redactNames()"
        data-tooltip="Redact common human names"
      >
        Names
      </button>
      <button
        class="redact-btn"
        onclick="redactDates()"
        data-tooltip="Redact common date formats"
      >
        Dates
      </button>
      <button
        class="redact-btn"
        onclick="redactPhones()"
        data-tooltip="Redact wide-number of phone number formats"
      >
        Phones
      </button>
      <button
        class="redact-btn"
        onclick="redactEmails()"
        data-tooltip="Redact email addresses"
      >
        Emails
      </button>
      <button
        class="redact-btn"
        onclick="redactPlaces()"
        data-tooltip="Redact country and city names"
      >
        Places
      </button>
    </div>

    <!-- REDACTION PATTERNS TEXT AREA -->
    <div
      id="redactPatterns"
      contenteditable="true"
      placeholder="Enter patterns to redact (one per line)."
    ></div>

    <!-- BUTTON CONTAINER CUSTOM -->
    <div class="button-container">
      <button class="redact-btn" onclick="redactText()">
        Redact Custom Text
      </button>
    </div>

    <!-- Backdrop -->
    <div class="panel-backdrop" onclick="togglePanel()"></div>

    <!-- SIDE PANEL -->
    <aside class="side-panel">
      <button class="close-btn" onclick="togglePanel()">×</button>
      <div class="panel-content">
        <h2 class="panel-title">Redaction Parameters</h2>

        <div class="panel-section">
          <p class="section-label">Redaction Placeholder</p>
          <div class="pill-group" onchange="toggleRedactionPlaceholder()">
            <input
              type="radio"
              name="placeholderMode"
              id="block"
              value="false"
              checked
            />
            <label
              for="block"
              class="pill"
              data-tooltip="Use block-style placeholders: █████"
              >Block</label
            >

            <input
              type="radio"
              name="placeholderMode"
              id="labelled"
              value="true"
            />
            <label
              for="labelled"
              class="pill"
              data-tooltip="Use labelled placeholders: [REDACTED-DATE]"
              >Labelled</label
            >
          </div>
        </div>
      </div>
    </aside>

    <div class="footer">
      <span class="footer-light">Powered by Robo [【•】◡【•】]</span>
      <span class="footer-dark">Powered by Robo [【-】◡【-】] zZz</span>
      <a
        href="https://github.com/ironlegit/shiny-clippy"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-github"
        aria-label="View source on GitHub"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
        .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
        -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </div>
    <!-- Import NLP module and JS -->
    <script src="vendor/compromise.js"></script>
    <script src="vendor/compromise-dates.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/button.js"></script>
  </body>
</html>
