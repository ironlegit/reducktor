<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               trusted-types 'none';
               require-trusted-types-for 'script';
               script-src 'self';
               style-src 'self';
               font-src 'self';
               img-src 'self' data:;
               connect-src 'none';
               form-action 'none';
               base-uri 'none'"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re███tor</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/ui.css" />
  </head>
  <body>
    <!-- Mobile Block -->
    <div
      class="mobile-block"
      id="mobileBlock"
      role="dialog"
      aria-modal="true"
      aria-label="Mobile device notice"
    >
      <span aria-hidden="true">🦆🦆🦆🦆🦆🦆</span>
      <p>
        ⚠️ This page isn't optimized for mobile yet... Visit on a desktop
        browser for the full experience.
      </p>
      <button id="mobileDismissBtn" class="mobile-dismiss-btn">
        Continue anyway
      </button>
    </div>
    <div class="svg-container">
      <img src="assets/reducktor.svg" alt="" aria-hidden="true" />
    </div>
    <h4>A Text Redaction Tool</h4>
    <!-- SIDE PANEL TOGGLE -->
    <div class="toggle-container left">
      <button
        id="sidebar-btn"
        class="toggle-btn"
        aria-label="Settings Panel"
        aria-controls="sidePanel"
        aria-expanded="false"
      >
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
    </div>

    <!-- DARK MODE TOGGLE BUTTON CONTAINER -->
    <div class="toggle-container right">
      <button
        id="darkmode-btn"
        class="toggle-btn"
        aria-label="Dark mode"
        aria-pressed="false"
      >
        <i class="fa-solid fa-moon icon-moon" aria-hidden="true"></i>
        <i class="fa-solid fa-sun icon-sun" aria-hidden="true"></i>
      </button>
    </div>

    <!-- THREE-PANE WORKSPACE -->
    <main class="app-layout">
      <!-- LEFT PANE: custom redaction patterns -->
      <section class="pane pane-input" aria-labelledby="inputHeading">
        <p class="pane-label" id="inputHeading">Original</p>

        <div class="clipboard-wrapper">
          <div class="clipboard-actions">
            <button
              class="clipboardBtn"
              id="flushAllBtn"
              data-tooltip="Clear original and redacted text"
              aria-label="Clear original and redacted text"
            >
              <i class="fas fa-trash-can icon-default" aria-hidden="true"></i>
              <i class="fa-solid fa-check icon-done" aria-hidden="true"></i>
            </button>
          </div>
          <div
            id="clipboardIn"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            aria-label="Original text"
            placeholder="Dump your text here..."
          ></div>
        </div>
      </section>

      <!-- MIDDLE PANE: thematic NLP redactors, stacked vertically -->
      <section class="pane pane-actions" aria-labelledby="nlpHeading">
        <p class="pane-label" id="nlpHeading">Redactors</p>

        <div class="btn-grid" role="group" aria-label="Entity redaction">
          <button class="redact-btn" id="redact-orgs-btn">Orgs</button>
          <button class="redact-btn" id="redact-names-btn">Names</button>
          <button class="redact-btn" id="redact-dates-btn">Dates</button>
          <button class="redact-btn" id="redact-phones-btn">Phones</button>
          <button class="redact-btn" id="redact-emails-btn">Emails</button>
          <button class="redact-btn" id="redact-places-btn">Places</button>
        </div>

        <hr class="pane-divider" aria-hidden="true" />

        <p class="pane-label" id="patternsHeading">Custom patterns</p>
        <div
          id="redactPatterns"
          contenteditable="true"
          placeholder="One pattern per line. Use /%/ to replace a pattern with a custom word."
        ></div>

        <div class="btn-grid" role="group" aria-label="Custom redaction">
          <button class="redact-btn" id="redactBtn">Redact Custom</button>
          <button
            class="redact-btn"
            id="reverseBtn"
            aria-pressed="false"
            data-tooltip="Reverses the order of the redaction pattern."
          >
            Reverse: off
          </button>
        </div>
      </section>

      <!-- RIGHT PANE: main workspace -->
      <section class="pane pane-output" aria-labelledby="outputHeading">
        <p class="pane-label" id="outputHeading">Redacted</p>
        <div class="clipboard-wrapper">
          <div class="clipboard-actions">
            <button
              class="clipboardBtn"
              id="copyBtn"
              data-tooltip="Copy redacted text"
              aria-label="Copy redacted text"
            >
              <i class="fa-solid fa-copy" aria-hidden="true"></i>
              <i class="fa-solid fa-check icon-done" aria-hidden="true"></i>
            </button>
            <button
              class="clipboardBtn"
              id="flushBtn"
              data-tooltip="Clear redacted text"
              aria-label="Clear redacted text"
            >
              <i class="fas fa-trash-can icon-default" aria-hidden="true"></i>
              <i class="fa-solid fa-check icon-done" aria-hidden="true"></i>
            </button>
          </div>
          <div
            id="clipboardOut"
            contenteditable="false"
            role="region"
            aria-multiline="true"
            aria-label="Redacted output"
            placeholder="Redacted text appears here..."
          ></div>
        </div>
      </section>
    </main>

    <!-- Backdrop -->
    <div class="panel-backdrop" id="panelBackdrop"></div>

    <!-- SIDE PANEL -->
    <aside
      class="side-panel"
      id="sidePanel"
      role="dialog"
      aria-modal="true"
      aria-label="Settings"
      inert
    >
      <button class="close-btn" id="panelCloseBtn" aria-label="Close panel">
        ×
      </button>
      <div class="panel-content">
        <h2 class="panel-title">Demo mode</h2>
        <div class="button-container">
          <button class="redact-btn" id="demoBtn">Load Example</button>
        </div>
        <h2 class="panel-title">Redaction Parameters</h2>

        <div class="panel-section">
          <p class="section-label">Redaction Placeholder</p>
          <div class="pill-group" id="placeholderMode">
            <input
              type="radio"
              name="placeholderMode"
              id="block"
              value="false"
              checked
            />
            <label
              for="block"
              class="pill"
              data-tooltip="Use block-style placeholders: █████"
              >Block</label
            >

            <input
              type="radio"
              name="placeholderMode"
              id="labelled"
              value="true"
            />
            <label
              for="labelled"
              class="pill"
              data-tooltip="Use labelled placeholders: [REDACTED-DATE]"
              >Labelled</label
            >
          </div>
        </div>
      </div>
    </aside>

    <div class="footer">
      <span class="footer-light">Powered by Robo [【•】◡【•】]</span>
      <span class="footer-dark">Powered by Robo [【-】◡【-】] zZz</span>
      <a
        href="https://github.com/ironlegit/shiny-clippy"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-github"
        aria-label="View source on GitHub"
      >
        <svg
          viewBox="0 0 16 16"
          width="16"
          height="16"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
        .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
        -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </div>
    <!-- Import NLP module and JS -->
    <script src="vendor/compromise.js"></script>
    <script src="vendor/compromise-dates.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/button.js"></script>
  </body>
</html>
